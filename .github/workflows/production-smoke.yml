name: SEEKMESH production smoke
on:
  push:
    paths:
      - '.github/workflows/production-smoke.yml'
      - 'Dockerfile'
      - 'server.js'
      - 'realm-os/**'
      - 'wallet/**'
      - 'public/terminal.js'
      - 'public/terminal.html'
      - 'public/launch-upgrades.js'
      - 'public/genesis.js'
      - 'public/experience.js'
      - 'public/experience.css'
      - 'public/operator.js'
      - 'economy/**'
      - 'launch/**'
      - 'atlas/**'
      - 'native/**'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify new Founder Realm, art, discovery and economy in production
        env:
          BASE: https://seekmesh-web-production.up.railway.app
        run: |
          set -euo pipefail
          for n in $(seq 1 15); do
            if curl -fsS --max-time 10 "$BASE/api/health" | jq -e '.status=="ok" and .version=="1.4.1"' >/dev/null; then break; fi
            sleep 5
          done
          # Wait for the CURRENT commit's feature set; older versions can pass /api/health during rollout.
          ready=0
          for n in $(seq 1 30); do
            if curl -fsS --max-time 15 "$BASE/" -o /tmp/seekmesh-home.html &&
               grep -q 'id="guild-detail"' /tmp/seekmesh-home.html &&
               curl -fsS --max-time 15 "$BASE/terminal.js" -o /tmp/seekmesh-frontend.js &&
               grep -q '/api/mesh/wallet-challenge' /tmp/seekmesh-frontend.js &&
               grep -q 'personal_sign' /tmp/seekmesh-frontend.js &&
               grep -q '/api/siwe/challenge' /tmp/seekmesh-frontend.js &&
               grep -q 'id="os"' /tmp/seekmesh-home.html &&
               grep -q 'id="form-migrate"' /tmp/seekmesh-home.html &&
               grep -q 'id="genesis"' /tmp/seekmesh-home.html &&
               grep -q 'id="journey-title"' /tmp/seekmesh-home.html &&
               grep -q 'id="home-leaderboard"' /tmp/seekmesh-home.html &&
               curl -fsS --max-time 15 "$BASE/experience.js" -o /tmp/seekmesh-experience.js &&
               grep -q 'SeekmeshExperience' /tmp/seekmesh-experience.js &&
               curl -fsS --max-time 15 "$BASE/experience.css" -o /tmp/seekmesh-experience.css &&
               grep -q 'realm-feature-grid' /tmp/seekmesh-experience.css &&
               curl -fsS --max-time 15 "$BASE/genesis.js" -o /tmp/seekmesh-genesis.js &&
               grep -q 'SeekmeshGenesis' /tmp/seekmesh-genesis.js &&
               curl -fsS --max-time 15 "$BASE/api/genesis/status" -o /tmp/seekmesh-genesis-status.json &&
               jq -e '.schema=="seekmesh.genesis.v1" and .currency=="GENESIS_DROPS_IN_APP" and .tokenIssued==false and .guaranteedFutureAirdrop==false' /tmp/seekmesh-genesis-status.json >/dev/null &&
               curl -fsS --max-time 15 "$BASE/launch-upgrades.js" -o /tmp/seekmesh-launch.js &&
               grep -q 'fundWalletExpedition' /tmp/seekmesh-launch.js &&
               curl -fsS --max-time 15 "$BASE/api/atlas" -o /tmp/seekmesh-atlas-api.json &&
               jq -e '.agents|type=="array"' /tmp/seekmesh-atlas-api.json >/dev/null &&
               curl -fsS --max-time 15 "$BASE/api/os/status" -o /tmp/seekmesh-realm-os.json &&
               jq -e '.schema=="seekmesh.realm_os.v1" and .logicalAgentRoles==10 and .physicalOSAgents==0 and .tokenIssued==false and .usdcEscrowLive==false and (.x402PaymentsLive|type)=="boolean" and (.phases|length)==6' /tmp/seekmesh-realm-os.json >/dev/null &&
               curl -fsS --max-time 15 -X POST "$BASE/mcp" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: tools/list' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"seekmesh-live-smoke","version":"1.0.0"}}}}' -o /tmp/seekmesh-mcp.json &&
               jq -e '.result.tools|any(.name=="search_sources")' /tmp/seekmesh-mcp.json >/dev/null &&
               curl -fsS --max-time 15 "$BASE/assets/realm-hero.webp" -o /tmp/realm-hero.webp; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then echo "Production failed to expose v1.3 Realm migration/Atlas/market JS + SIWE release"; exit 1; fi
          set -x
          curl -fsS --max-time 20 "$BASE/" -o /tmp/seekmesh-home.html
          grep -q 'id="home"' /tmp/seekmesh-home.html
          grep -q 'id="guilds"' /tmp/seekmesh-home.html
          grep -q 'id="guild-detail"' /tmp/seekmesh-home.html
          grep -q 'id="market"' /tmp/seekmesh-home.html
          grep -q 'id="mission-grid"' /tmp/seekmesh-home.html
          curl -fsS --max-time 20 "$BASE/terminal.js" -o /tmp/seekmesh-frontend.js
          grep -q '/api/mesh/submit' /tmp/seekmesh-frontend.js
          grep -q '/api/mesh/wallet-challenge' /tmp/seekmesh-frontend.js
          grep -q 'personal_sign' /tmp/seekmesh-frontend.js
          for asset in hero avatar missions explore guilds build rewards market; do
            curl -fsS --max-time 20 "$BASE/assets/realm-$asset.webp" -o "/tmp/realm-$asset.webp"
            test "$(wc -c < "/tmp/realm-$asset.webp")" -gt 1000
          done
          curl -fsS --max-time 20 "$BASE/api/stats" | jq -e '.resources>=16'
          curl -fsS --max-time 20 "$BASE/api/mesh/stats" | jq -e '.nodes>=0 and .completedActions>=0 and .tokenIssued==false'
          curl -fsS --max-time 20 "$BASE/api/mesh/leaderboard" | jq -e '.members|type=="array"'
          curl -fsS --max-time 20 "$BASE/api/mesh/quests" | jq -e '.quests|length==5'
          curl -fsS --max-time 20 "$BASE/api/guilds" | jq -e '.guilds|type=="array"'
          curl -fsS --max-time 20 "$BASE/guilds" -o /tmp/seekmesh-guilds.html
          grep -q 'data-action="guild-create"' /tmp/seekmesh-guilds.html
          curl -fsS --max-time 20 "$BASE/market" -o /tmp/seekmesh-market.html
          grep -q 'id="market"' /tmp/seekmesh-market.html
          curl -fsS --max-time 20 "$BASE/api/autonomy/status" | jq -e '.enabled==true'
          curl -fsS --max-time 20 "$BASE/os" -o /tmp/seekmesh-os.html
          grep -q 'id="os-metrics"' /tmp/seekmesh-os.html
          grep -q 'id="os-expeditions"' /tmp/seekmesh-os.html
          grep -q 'id="os-signals"' /tmp/seekmesh-os.html
          curl -fsS --max-time 20 "$BASE/api/os/status" | jq -e '.independentWeb3==true and .logicalAgentRoles==10 and .physicalOSAgents==0 and .tokenIssued==false and (.x402PaymentsLive|type)=="boolean" and (.roles|length)==10'
          curl -fsS --max-time 20 "$BASE/api/os/expeditions" | jq -e '.expeditions|length>=1'
          test "$(curl -sS -o /tmp/os-admin-anon.json -w '%{http_code}' --max-time 20 "$BASE/api/admin/os")" = "401"
          grep -q 'Unauthorized' /tmp/os-admin-anon.json
          grep -q '/api/siwe/verify' /tmp/seekmesh-frontend.js
          test "$(curl -sS -o /tmp/workpackets-anon.json -w '%{http_code}' --max-time 20 "$BASE/api/admin/mesh/workpackets")" = "401"
          grep -q 'error' /tmp/workpackets-anon.json
          curl -fsS --max-time 20 "$BASE/market" -o /tmp/seekmesh-market-pilot.html
          grep -q 'Fund a Discovery Expedition' /tmp/seekmesh-market-pilot.html
          grep -q 'x402' /tmp/seekmesh-market-pilot.html
          if grep -Eq 'C\$149|Stripe' /tmp/seekmesh-market-pilot.html; then echo 'Unrelated SaaS billing still in Market'; exit 1; fi
          curl -fsS --max-time 20 "$BASE/whitepaper" -o /tmp/seekmesh-whitepaper.html
          grep -q 'The world of' /tmp/seekmesh-whitepaper.html
          grep -q 'docs/WHITEPAPER_V1.md' /tmp/seekmesh-whitepaper.html
          grep -q 'NOT ISSUED' /tmp/seekmesh-whitepaper.html
          curl -fsS --max-time 20 "$BASE/whitepaper.css" -o /tmp/seekmesh-whitepaper.css
          test "$(wc -c < /tmp/seekmesh-whitepaper.css)" -gt 1000
          # v1.3 live launch upgrades. These tests intentionally do not create real payments or user accounts.
          curl -fsS --max-time 20 "$BASE/migrate" -o /tmp/seekmesh-migrate.html
          grep -q 'id="form-migrate"' /tmp/seekmesh-migrate.html
          grep -q 'id="migrate-claim"' /tmp/seekmesh-migrate.html
          curl -fsS --max-time 20 "$BASE/atlas" -o /tmp/seekmesh-atlas.html
          grep -q 'id="atlas-results"' /tmp/seekmesh-atlas.html
          grep -q 'id="form-atlas-agent"' /tmp/seekmesh-atlas.html
          curl -fsS --max-time 20 "$BASE/launch-upgrades.js" -o /tmp/seekmesh-launch.js
          grep -q 'fundWalletExpedition' /tmp/seekmesh-launch.js
          curl -fsS --max-time 20 "$BASE/api/migrate" | jq -e '.campaigns|type=="array"'
          curl -fsS --max-time 20 "$BASE/api/atlas" | jq -e '.agents|type=="array"'
          curl -fsS --max-time 20 "$BASE/api/native/campaigns" | jq -e '.campaigns|type=="array"'
          curl -fsS --max-time 20 "$BASE/api/native/x402/status" | jq -e '.protocol=="x402-v2" and .priceMicroUSDC==50000 and (.verifiedSettledRequests|type)=="number"'
          curl -fsS --max-time 20 "$BASE/api/proof/preview?id=1" | jq -e '.availablePaidReport==true'
          test "$(curl -sS -o /tmp/seekmesh-no-payment.json -w '%{http_code}' --max-time 20 "$BASE/api/proof/premium?id=1")" = "503" || {
            # Once an independent receiver is configured, unpaid requests are 402, never 200.
            test "$(curl -sS -o /tmp/seekmesh-no-payment.json -w '%{http_code}' --max-time 20 "$BASE/api/proof/premium?id=1")" = "402"
          }
          test "$(curl -sS -o /tmp/seekmesh-no-login.json -w '%{http_code}' --max-time 20 "$BASE/api/migrate/mine")" = "401"
          test "$(curl -sS -o /tmp/seekmesh-no-admin.json -w '%{http_code}' --max-time 20 "$BASE/api/admin/atlas/sync" -X POST -H 'Content-Type: application/json' --data '{}')" = "401"
          curl -fsS --max-time 20 "$BASE/.well-known/farcaster.json" | jq -e '.miniapp.name=="SEEKMESH" and (.miniapp.iconUrl|endswith(".png"))'
          curl -fsS --max-time 20 "$BASE/api/farcaster/status" | jq -e '(.associated|type)=="boolean"'
          for asset in icon splash social; do
            curl -fsS --max-time 20 "$BASE/assets/seekmesh-$asset.png" -o "/tmp/seekmesh-$asset.png"
            test "$(wc -c < "/tmp/seekmesh-$asset.png")" -gt 5000
          done
          curl -fsS --max-time 20 "$BASE/api/os/expeditions" | jq -e '.expeditions|length>0'
          curl -fsS --max-time 20 "$BASE/expedition/1" -o /tmp/seekmesh-expedition.html
          grep -q 'fc:miniapp' /tmp/seekmesh-expedition.html
          curl -fsS --max-time 20 "$BASE/api/agent.json" | jq -e '.mcp.protocolVersion=="2026-07-28" and (.api.search|contains("/api/resources"))'
          curl -fsS --max-time 20 "$BASE/api/mcp/stats" | jq -e '(.toolCalls|type)=="number" and .uniqueAgentsMeasured==false'
          echo 'Live, observed SEEKMESH OS/Atlas metrics (no fake transactions):'
          curl -fsS --max-time 20 "$BASE/api/os/status" | jq '{lastPulse,execution,metrics:{resources:.metrics.resources,atlas_entries:.metrics.atlas_entries,imported_campaigns:.metrics.imported_campaigns,verified_x402_payments:.metrics.verified_x402_payments,settled_campaigns:.metrics.settled_campaigns,mcp_tool_calls_7d:.metrics.mcp_tool_calls_7d}}'
          # Genesis Season Zero: actual real users versus individually marked sandbox-only agents.
          curl -fsS --max-time 20 "$BASE/genesis" -o /tmp/seekmesh-genesis-view.html
          grep -q 'id="genesis"' /tmp/seekmesh-genesis-view.html
          grep -q 'id="genesis-demo-board"' /tmp/seekmesh-genesis-view.html
          curl -fsS --max-time 20 "$BASE/api/genesis/status" | jq -e '.schema=="seekmesh.genesis.v1" and .starts=="2026-11-15" and .ends=="2026-12-15" and .tokenIssued==false and .guaranteedFutureAirdrop==false and .realDropsCredited>=0'
          curl -fsS --max-time 20 "$BASE/api/genesis/leaderboard" | jq -e '.scope=="real" and (.members|type)=="array"'
          curl -fsS --max-time 20 "$BASE/api/genesis/leaderboard?scope=simulation" | jq -e '.scope=="simulation" and (.members|length)>=12 and (.label|contains("SIMULATED"))'
          test "$(curl -sS -o /tmp/no-genesis-me.json -w '%{http_code}' --max-time 20 "$BASE/api/genesis/me")" = "401"
          test "$(curl -sS -o /tmp/no-genesis-admin.json -w '%{http_code}' --max-time 20 "$BASE/api/admin/genesis/dashboard")" = "401"
          curl -fsS --max-time 20 "$BASE/operator" -o /tmp/seekmesh-founder.html
          grep -q 'id="genesis-admin-stats"' /tmp/seekmesh-founder.html
          curl -fsS --max-time 20 "$BASE/api/genesis/status" | jq '{schema,realMembers,realDropsCredited,qualifiedReferrals,tokenIssued,guaranteedFutureAirdrop}'
          echo 'SEEKMESH Genesis Season Zero + 12 isolated QA agents + all native Web3 launch smoke PASS'

