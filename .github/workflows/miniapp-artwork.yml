name: SEEKMESH original Realm Mini App artwork
on:
  push:
    paths:
      - '.github/workflows/miniapp-artwork.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Build compliant image assets from founder-approved art
        run: |
          python - <<'PY'
          from PIL import Image,ImageOps,ImageDraw,ImageFont
          from pathlib import Path
          d=Path('public/assets')
          original=Image.open(d/'realm-avatar.webp').convert('RGB')
          icon=ImageOps.fit(original,(1024,1024),method=Image.Resampling.LANCZOS,centering=(.5,.48))
          icon.save(d/'seekmesh-icon.png',optimize=True)
          splash=ImageOps.fit(original,(512,512),method=Image.Resampling.LANCZOS)
          splash.save(d/'seekmesh-splash.png',optimize=True)
          art=Image.open(d/'realm-hero.webp').convert('RGB')
          banner=ImageOps.fit(art,(1200,630),method=Image.Resampling.LANCZOS)
          banner.save(d/'seekmesh-social.png',optimize=True)
          print([(p.name,p.stat().st_size) for p in [d/'seekmesh-icon.png',d/'seekmesh-splash.png',d/'seekmesh-social.png']])
          PY
      - name: Publish reusable official artwork without changing the existing design
        run: |
          git config user.name "SEEKMESH Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/assets/seekmesh-*.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(farcaster): official 1024px Mini App icon, splash and social preview from approved Realm artwork"
            git push
          fi
