name: Import founder provided SEEKMESH artwork
on:
  push:
    paths:
      - '.github/workflows/import-artwork.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Fetch supplied original art and produce optimized WEBP crops
        env:
          ASSET_CANDIDATES: "https://media.canva.com/v2/image-resize/format:PNG/height:941/quality:100/uri:ifs%3A%2F%2FM%2F8497ad21-d464-4350-87a6-457c3d14f946/watermark:F/width:1672?csig=AAAAAAAAAAAAAAAAAAAAAO6UehsIXKxGpvu5xV_2rG7OPmwHWnUwQsE51XBrObEV&exp=1794774914&osig=AAAAAAAAAAAAAAAAAAAAAKtSwQNk5O9qdW37_pufeSnLE0bHDpYRzgO3ASnbvD3M&signer=media-rpc&token=AAIAAU0AJDg0OTdhZDIxLWQ0NjQtNDM1MC04N2E2LTQ1N2MzZDE0Zjk0NgAAAAABoeDr09BGmoymOAe_ufr9A-THkA9mNARwZQzyXGQzoNyjaNNq5A&x-canva-quality=thumbnail||https://media.canva.com/v2/image-resize/format:WEBP/height:941/quality:100/uri:ifs%3A%2F%2FM%2F8497ad21-d464-4350-87a6-457c3d14f946/watermark:F/width:1672?csig=AAAAAAAAAAAAAAAAAAAAAO6UehsIXKxGpvu5xV_2rG7OPmwHWnUwQsE51XBrObEV&exp=1794774914&osig=AAAAAAAAAAAAAAAAAAAAAKtSwQNk5O9qdW37_pufeSnLE0bHDpYRzgO3ASnbvD3M&signer=media-rpc&token=AAIAAU0AJDg0OTdhZDIxLWQ0NjQtNDM1MC04N2E2LTQ1N2MzZDE0Zjk0NgAAAAABoeDr09BGmoymOAe_ufr9A-THkA9mNARwZQzyXGQzoNyjaNNq5A&x-canva-quality=thumbnail||https://media.canva.com/v2/image-resize/format:PNG/height:752/quality:100/uri:ifs%3A%2F%2FM%2F8497ad21-d464-4350-87a6-457c3d14f946/watermark:F/width:1337?csig=AAAAAAAAAAAAAAAAAAAAAO6UehsIXKxGpvu5xV_2rG7OPmwHWnUwQsE51XBrObEV&exp=1794774914&osig=AAAAAAAAAAAAAAAAAAAAAKtSwQNk5O9qdW37_pufeSnLE0bHDpYRzgO3ASnbvD3M&signer=media-rpc&token=AAIAAU0AJDg0OTdhZDIxLWQ0NjQtNDM1MC04N2E2LTQ1N2MzZDE0Zjk0NgAAAAABoeDr09BGmoymOAe_ufr9A-THkA9mNARwZQzyXGQzoNyjaNNq5A&x-canva-quality=thumbnail||https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2F8497ad21-d464-4350-87a6-457c3d14f946/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAO6UehsIXKxGpvu5xV_2rG7OPmwHWnUwQsE51XBrObEV&exp=1794774914&osig=AAAAAAAAAAAAAAAAAAAAAKtSwQNk5O9qdW37_pufeSnLE0bHDpYRzgO3ASnbvD3M&signer=media-rpc&token=AAIAAU0AJDg0OTdhZDIxLWQ0NjQtNDM1MC04N2E2LTQ1N2MzZDE0Zjk0NgAAAAABoeDr09BGmoymOAe_ufr9A-THkA9mNARwZQzyXGQzoNyjaNNq5A&x-canva-quality=thumbnail"
        run: |
          python - <<'PY'
            from PIL import Image
            from io import BytesIO
            from pathlib import Path
            from urllib.request import Request, urlopen
            import os
            urls=os.environ['ASSET_CANDIDATES'].split('||')
            img=None
            for i,url in enumerate(urls):
             try:
              with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=18) as r:
               data=r.read()
               candidate=Image.open(BytesIO(data));candidate.load()
              print('candidate',i,'dimensions',candidate.size,'bytes',len(data))
              if img is None or candidate.width>img.width:img=candidate
             except Exception as e:
              print('candidate',i,'failed',str(e)[:180])
            if img is None or img.width<1000 or img.height<500:
             raise SystemExit('No high-resolution artwork was retrievable; refusing to commit a low quality thumbnail')
            img=img.convert('RGB')
            out=Path('public/assets')
            out.mkdir(parents=True,exist_ok=True)
            img.save(out/'realm-reference.webp','WEBP',quality=88,method=6)
            # Clean artwork region excludes embedded nav, text and account overlay; CSS draws functional UI on top
            img.crop((int(img.width*.272),int(img.height*.057),int(img.width*.792),int(img.height*.641))).save(out/'realm-hero.webp','WEBP',quality=90,method=6)
            # Individual fantasy feature illustrations, avoiding baked-in labels
            tiles=[('missions',(.047,.592,.165,.742)),('explore',(.195,.590,.325,.742)),('guilds',(.346,.592,.477,.738)),('build',(.508,.588,.637,.740)),('rewards',(.666,.590,.795,.739)),('market',(.811,.588,.951,.739))]
            for name,(x0,y0,x1,y1) in tiles:
             crop=img.crop((int(x0*img.width),int(y0*img.height),int(x1*img.width),int(y1*img.height)))
             crop.save(out/f'realm-{name}.webp','WEBP',quality=88,method=6)
            print('DONE: assets:',[(p.name,p.stat().st_size) for p in out.glob('realm-*.webp')])
            
          PY
      - name: Commit exact artwork assets
        run: |
          git config user.name "SEEKMESH Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/assets/realm-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: package approved founder fantasy artwork into permanent site assets"
            git push
          fi
