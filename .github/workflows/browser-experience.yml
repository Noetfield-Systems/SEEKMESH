name: SEEKMESH browser experience QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/terminal.html'
      - 'public/terminal.css'
      - 'public/terminal.js'
      - 'public/experience.css'
      - 'public/experience.js'
      - 'tests/browser-experience.mjs'
      - '.github/workflows/browser-experience.yml'
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA dependency
        run: npm install --no-audit --no-fund --no-save playwright@1.58.0
      - name: Install headless Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify deployed desktop/mobile launch and capture screenshots
        run: node tests/browser-experience.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seekmesh-experience-screenshots
          path: artifacts/
          if-no-files-found: warn
